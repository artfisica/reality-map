name: Build and deploy the atlas

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'build.py'
      - 'site.yaml'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Check publication integrity
        run: python scripts/validate.py --strict

      - name: Check every internal link resolves
        run: python scripts/check_links.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Exercise the interface layer against the built pages
        run: npm run test:interface

      - name: Check the feed is reproducible
        run: |
          cp docs/feed.xml /tmp/feed.first.xml
          python build.py
          cmp /tmp/feed.first.xml docs/feed.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
