# The Civilian Geopolitical Reality Map / Mapa civil de la realidad geopolitica
#
# The markdown in content/ is canonical. This file records order, URLs, the
# links between documents, and the interface strings for each edition.

site:
  base_url: "https://artfisica.github.io/reality-map"
  default_lang: en
  author: Arturo Sánchez Pineda

  # Classification matching runs in this order, most specific first. It is
  # deliberately not the display order: "Historical synthesis supported by UN
  # record" must reach `finding` before `record` can claim the word "record".
  match_order: [forecast, inference, court, finding, position, record]

  # Terms the Spanish edition must not use. Checked by scripts/validate.py.
  # Only the nouns are prohibited, in favour of legalidad and falta de
  # legalidad. The adjectives lícito and ilícito stay available, because
  # phrases such as "uso ilícito de la fuerza" are legally precise.
  prohibited:
    es: [licitud, ilicitud]

  # The byline spelling the editions must use, checked in every content file.
  author_must_read: Arturo Sánchez Pineda

  # Source cells naming several documents rather than one. These are deliberate
  # aggregates, not missing URLs, so validation reports them as notes.
  aggregate_patterns:
    en:
      - "^Above sources"
      - "^Inquiry, oversight"
      - "records$"
      - "reports$"
      - "report$"
      - "above$"
    es:
      - "^Fuentes anteriores"
      - "^Investigaciones,"
      - "^Expedientes"
      - "anteriores$"
      - "anterior$"
      - "reportaje de la BBC$"

# --------------------------------------------------------------------------
# English edition, served from the root
# --------------------------------------------------------------------------
en:
  dir: ""
  code: en
  label: English
  other: es
  title: The Civilian Geopolitical Reality Map
  title_lines: ["The Civilian", "Geopolitical", "Reality Map"]
  short: Reality Map
  tagline: How to understand states by what they do, not what they declare
  edition: 17 August 2026
  version: "0.3"
  description: >-
    A civilian framework for reading state conduct through instruments,
    dependencies and costs, with every factual claim classified and traced to a
    primary or authoritative source.

  method:
    file: 00-method.md
    slug: method
    label: Method
    standfirst_from: "Author's position"

  studies_dir: studies
  studies:
    - {file: 01-adversaries.md,   slug: adversaries,   numeral: I,
       ledger_sections: ["Gaza, Israel, Europe and Switzerland", "Lebanon"]}
    - {file: 02-administration.md, slug: administration, numeral: II,
       ledger_sections: ["Territorial administration and colonial continuity"]}
    - {file: 03-abandonment.md,   slug: abandonment,   numeral: III,
       ledger_sections: ["Afghanistan, Iraq and Syria"]}
    - {file: 04-caribbean.md,     slug: caribbean,     numeral: IV,
       ledger_sections: ["Caribbean and Pacific maritime killings"]}
    - {file: 05-venezuela.md,     slug: venezuela,     numeral: V,
       ledger_sections: ["Venezuela, sovereignty and the ICC"]}

  ledger:
    file: ledger.md
    slug: ledger
    label: Ledger
    title: Claim and source ledger
    subtitle: What the record supports, and what it does not
    eyebrow: Evidentiary control

  evidence_classes:
    - id: record
      name: Record
      full: Record or verified event
      note: A dated act or status supported by an official or documentary record.
      match: [verified event, treaty fact, legislative event, depositary,
              institutional act, status, current legal, record, reporting,
              parliamentary, limitation, executive order, documentary fact]
    - id: court
      name: Court rule
      full: Court or treaty rule
      note: An order, warrant or rule with defined legal effect. A warrant is not a conviction.
      match: [judicial, warrant, provisional, treaty rule]
    - id: finding
      name: Finding
      full: Investigative finding
      note: A conclusion by a competent inquiry, oversight body or assessment, not a court.
      match: [investigative, inquiry, oversight finding, authoritative, assessment, synthesis, journalis]
    - id: position
      name: Position
      full: Official position
      note: What a government or institution states. Attributed, never adopted as fact.
      match: [position, statement, proposal, policy]
    - id: inference
      name: Inference
      full: Analytical inference
      note: A conclusion drawn from the record and labelled as the author's analysis.
      match: [analytical, analysis, inference]
    - id: forecast
      name: Forecast
      full: Forecast or risk
      note: A possible future outcome, stated as a risk and never as a prediction.
      match: [forecast, risk]

  ui:
    skip: Skip to the text
    case_study: Case study
    the_method: The method
    min_read: min read
    sources: sources
    sources_h: Sources
    sources_lede: >-
      Sources include primary documents, official records, attributed
      investigative reporting and separately identified authorial context.
      Links open the originals.
    authorial_lede: >-
      The author writing in his own voice. This is context for the argument,
      not evidence of the facts it examines.
    bar_note: >-
      The bars and counts show how many ledger claims fall in each evidence
      class. They are a count, not a confidence score and not a measure of
      evidentiary weight.
    documented_from: Documented from
    evidence_here: Evidence in this study
    see_all: See all {n} claims in the ledger
    in_this_document: In this document
    previous: Previous
    next: Next
    claims: claims
    files: files
    search: Search claims
    filter_by: Filter by evidence class
    n_of_m: "{n} of {m} claims"
    permitted: Wording the record supports
    avoid: Wording it does not
    no_results: No claim matches that search.
    clear: Clear the filters
    supports_study: "Case study {numeral}"
    position_label: Author's position
    key_h: Every claim carries its evidence class
    key_lede: >-
      A rule on paper is not an enforcement mechanism, and an accusation is not
      a finding. {n} claims are logged in the ledger, each with the wording the
      record supports and the wording it does not.
    mosaic_caption: >-
      Every claim in the atlas, one tile each, grouped by file and coloured by
      what kind of evidence stands behind it.
    open_ledger: Open the ledger
    register_h: The register
    register_lede: >-
      One manual and five case studies. The manual sets the method; each study
      applies it to a documented record.
    ways_h: Three ways in
    way1_k: Start with the method
    way1_d: >-
      The six-layer power map, the enforcement gradient and the tests that
      produce the rest of the atlas.
    way2_k: Start with Venezuela
    way2_d: >-
      Unlawful force, constrained autonomy and what a formal sovereign decision
      means after an intervention.
    way3_k: Start with the evidence
    way3_d: "Search {n} classified claims across {f} files."
    foot_1: >-
      Written by Arturo Sánchez Pineda. Every factual claim is classified and
      traced in the ledger. Corrections are part of the method.
    foot_2: >-
      No trackers, no analytics, no third-party requests. Fonts are served from
      this domain.
    mode_dark: Dark
    mode_light: Light

# --------------------------------------------------------------------------
# Spanish edition, served from /es/
# --------------------------------------------------------------------------
es:
  dir: es
  code: es
  label: Español
  other: en
  title: Mapa civil de la realidad geopolítica
  title_lines: ["Mapa civil", "de la realidad", "geopolítica"]
  short: Mapa civil
  tagline: Cómo entender a los Estados por lo que hacen, no por lo que declaran
  edition: 17 de agosto de 2026
  version: "0.3"
  description: >-
    Un marco civil para leer la conducta de los Estados a través de sus
    instrumentos, dependencias y costos, con cada afirmación clasificada y
    trazada hasta una fuente primaria o autorizada.

  method:
    file: 00-metodo.md
    slug: metodo
    label: Método
    standfirst_from: "Posición del autor"

  studies_dir: estudios
  studies:
    - {file: 01-adversarios.md,   slug: adversarios,   numeral: I,
       ledger_sections: ["Gaza, Israel, Europa y Suiza", "Líbano"]}
    - {file: 02-administracion.md, slug: administracion, numeral: II,
       ledger_sections: ["Administración territorial y continuidad colonial"]}
    - {file: 03-abandono.md,      slug: abandono,      numeral: III,
       ledger_sections: ["Afganistán, Irak y Siria"]}
    - {file: 04-caribe.md,        slug: caribe,        numeral: IV,
       ledger_sections: ["Ejecuciones marítimas en el Caribe y el Pacífico"]}
    - {file: 05-venezuela.md,     slug: venezuela,     numeral: V,
       ledger_sections: ["Venezuela, soberanía y CPI"]}

  ledger:
    file: registro.md
    slug: registro
    label: Registro
    title: Registro de afirmaciones y fuentes
    subtitle: Lo que el expediente sostiene y lo que no
    eyebrow: Control probatorio

  evidence_classes:
    - id: record
      name: Registro
      full: Registro o hecho verificado
      note: Un acto o estatus fechado y sostenido por un expediente oficial o documental.
      match: [hecho, acto, registro, estatus, clasificación vigente, limitación,
              informe, expediente, orden ejecutiva]
    - id: court
      name: Regla judicial
      full: Regla judicial o convencional
      note: Una orden o regla con efecto jurídico definido. Una orden de detención no es una condena.
      match: [judicial, provisional, regla convencional]
    - id: finding
      name: Conclusión
      full: Conclusión de investigación
      note: La conclusión de una investigación, un órgano de supervisión o una evaluación competente, no de un tribunal.
      match: [investigativ, investigaci, evaluación, supervisión, autorizada, síntesis histórica, periodística]
    - id: position
      name: Posición
      full: Posición oficial
      note: Lo que declara un gobierno o una institución. Se atribuye, nunca se adopta como hecho.
      match: [posición, declaración, propuesta]
    - id: inference
      name: Inferencia
      full: Inferencia analítica
      note: Una conclusión derivada del expediente y señalada como análisis del autor.
      match: [analítica, analítico, inferencia]
    - id: forecast
      name: Pronóstico
      full: Pronóstico o riesgo
      note: Un resultado futuro posible, enunciado como riesgo y nunca como predicción.
      match: [riesgo, pronóstico]

  ui:
    skip: Ir al texto
    case_study: Estudio de caso
    the_method: El método
    min_read: min de lectura
    sources: fuentes
    sources_h: Fuentes
    sources_lede: >-
      Las fuentes incluyen documentos primarios, expedientes oficiales,
      reportería de investigación atribuida y contexto autoral identificado por
      separado. Los enlaces abren los originales.
    authorial_lede: >-
      El autor escribiendo en su propia voz. Es contexto del argumento, no
      prueba de los hechos que examina.
    bar_note: >-
      Las barras y los conteos indican cuántas afirmaciones del registro
      corresponden a cada clase de evidencia. Son un conteo, no un puntaje de
      confianza ni una medida del peso probatorio.
    documented_from: Documentado a partir de
    evidence_here: Evidencia en este estudio
    see_all: Ver las {n} afirmaciones en el registro
    in_this_document: En este documento
    previous: Anterior
    next: Siguiente
    claims: afirmaciones
    files: expedientes
    search: Buscar afirmaciones
    filter_by: Filtrar por clase de evidencia
    n_of_m: "{n} de {m} afirmaciones"
    permitted: Redacción que el expediente sostiene
    avoid: Redacción que no sostiene
    no_results: Ninguna afirmación coincide con esa búsqueda.
    clear: Limpiar los filtros
    supports_study: "Estudio de caso {numeral}"
    position_label: Posición del autor
    key_h: Cada afirmación lleva su clase de evidencia
    key_lede: >-
      Una regla escrita no es un mecanismo de aplicación, y una acusación no es
