  evidence_paths:
    eyebrow: Trace the evidence
    title: Watch the conclusion change
    lede: >-
      Start with a question, then move through the record in the order the
      evidence appeared. Every step comes directly from a classified ledger
      claim; the final step is only as strong as its label.
    step: "Step {current} of {total}"
    previous: Previous step
    next: Next step
    ledger: Open the ledger claim
    source: Source record
    permitted: What the evidence permits
    paths:
      - id: transfers
        title: Was Canelón extradited—or transferred another way?
        summary: >-
          Begin with the US court record, then see how Pulido changes an
          isolated maritime mystery into a possible repeated channel.
        steps:
          - claim: VEN-CANELON-US-CUSTODY
            date: 2 October 2026
            turn: A Venezuelan reaches a US court. The accusation is not a conviction.
          - claim: VEN-CANELON-MARITIME-UNKNOWN
            date: October 2026
            turn: The FBI supplies a maritime location, but not the jurisdictional facts.
          - claim: VEN-CANELON-NONEXTRADITION
            date: Governing law
            turn: Article 69 makes Venezuelan custody and delivery the decisive missing facts.
          - claim: VEN-PULIDO-US-CUSTODY
            date: 13 October 2026
            turn: A second defendant appears in Florida after unnamed international coordination.
          - claim: VEN-PULIDO-TRANSFER-ATTRIBUTED
            date: 13 October 2026
            turn: Reporting places Pulido in Venezuelan imprisonment until his transfer.
          - claim: VEN-TRANSFER-CHANNEL-INFERENCE
            date: Current assessment
            turn: Repetition strengthens the channel hypothesis without proving a shared route.
      - id: oil-control
        title: Who controls Venezuelan oil?
        summary: >-
          Follow the record from a headline agreement to published official
          claims, implementation, institutional challenge and the clauses
          that remain hidden.
        steps:
          - claim: VEN-OIL-DEAL-ANNOUNCEMENT-20260828
            date: 28 August 2026
            turn: Two governments announce scale and projected benefits, not the operative clauses.
          - claim: VEN-OIL-NABEP-OFFICIAL-TERMS
            date: 31 August 2026
            turn: Washington names the company and claims equity, purchase and governance rights.
          - claim: VEN-OIL-GAZETTE-SUPPORT
            date: 1 September 2026
            turn: Parliament publishes its political support, but not the bargain it supports.
          - claim: VEN-OIL-25-100-UNRESOLVED
            date: 7 September 2026
            turn: The 25- and 100-year descriptions cannot both be read as the same vested term.
          - claim: VEN-OIL-GL52C
            date: 14 September 2026
            turn: Implementation advances through sanctions law without revealing the contract.
          - claim: VEN-OIL-SENATE-AUTHORITY-CHALLENGE
            date: 30 September 2026
            turn: Senior senators formally question the US statutory authority; no court has ruled.
          - claim: VEN-OIL-OVERSIGHT-GAP
            date: 2 October 2026
            turn: Congress receives one document, but the public still cannot inspect it.
          - claim: VEN-OIL-DEAL-DISCLOSURE-GAP
            date: 14 October 2026
            turn: The controlling instruments still set the boundary of what can honestly be claimed.
      - id: custody-control
        title: When does custody become control?
        summary: >-
          Compare Iraq's changing legal architecture with Venezuela's explicit
          disbursement regime, then test whether foreign custody produced
          observable political leverage without transferring ownership.
        steps:
          - claim: IRQ-OIL-NYFED-CUSTODY
            date: 2003–2026
            turn: Iraqi oil receipts remain Iraqi property while New York becomes the durable access point.
          - claim: IRQ-DFI-SUCCESSOR-TRANSITION
            date: 2011–2014
            turn: The UN mandate and US immunity regime end, but successor CBI accounts preserve the location.
          - claim: VEN-EO14373-FUNDS
            date: 9 January 2026
            turn: Venezuela's published arrangement goes further by assigning disbursement instructions to the US secretary of state.
          - claim: IRQ-CASH-LEVERAGE-2026
            date: April–July 2026
            turn: A suspension and conditional restart turn structural dependence into demonstrated leverage.
          - claim: VEN-GOLD-PROPOSED-TRANSFER
            date: 18 September 2026
            turn: A reported gold move could extend the pattern, but no completed transfer is documented.
          - claim: IRQ-VEN-ACCOUNT-COMPARISON
            date: Current assessment
            turn: The common mechanism is custody and access, not identical law or US ownership.

