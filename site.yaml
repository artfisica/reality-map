      - id: guam
        numeral: II
        name: Guam
        status: US unincorporated territory and UN Non-Self-Governing Territory
      - id: new-caledonia
        numeral: II
        name: New Caledonia
        status: French sui generis collectivity, UN Non-Self-Governing Territory
      - id: french-guiana
        numeral: II
        offset: [26, 12]
        name: French Guiana
        status: French and EU territory under Article 73; outside Schengen; not on the UN list
      - id: mesopotamia
        numeral: III
        offset: [0, -15]
        name: Iraq and Syria
        status: Invasion and cumulative internationalisation
      - id: afghanistan
        numeral: III
        offset: [20, 10]
        name: Afghanistan
        status: Twenty years of state building, then withdrawal
      - id: caribbean
        numeral: IV
        offset: [-24, -8]
        name: Caribbean Sea
        status: Maritime strikes in place of arrest and trial
      - id: eastern-pacific
        numeral: IV
        offset: [-10, 18]
        name: Eastern Pacific
        status: Maritime strikes in place of arrest and trial
      - id: venezuela
        numeral: V
        offset: [10, 18]
        name: Venezuela
        status: Unlawful intervention, not a belligerent occupation at the date of the Swiss assessment
      - id: washington
        numeral: VI
        offset: [0, -14]
        name: Washington, D.C.
        status: Decision centre for debt policy, aid dismantling and external resource control

  ledger:
    file: ledger.md
    slug: ledger
    label: Ledger
    title: Claim and source ledger
    subtitle: What the record supports, and what it does not
    eyebrow: Evidentiary control

  evidence_classes:
    - id: record
      name: Record
      full: Record or verified event
      note: A dated act or status supported by an official or documentary record.
      match: [verified, verified event, treaty fact, legislative event, depositary,
              institutional act, status, current legal, record, reporting,
              parliamentary, limitation, executive order, documentary fact]
    - id: court
      name: Court rule
      full: Court or treaty rule
      note: An order, warrant or rule with defined legal effect. A warrant is not a conviction.
      match: [judicial, warrant, provisional, treaty rule, customary ihl rule]
    - id: finding
      name: Finding
      full: Investigative finding
      note: A conclusion by a competent inquiry, oversight body or assessment, not a court.
      match: [investigative, inquiry, oversight finding, authoritative, assessment, synthesis, journalis]
    - id: position
      name: Position
      full: Official position
      note: What a government or institution states. Attributed, never adopted as fact.
      match: [position, statement, proposal, policy]
    - id: inference
      name: Inference
      full: Analytical inference
      note: A conclusion drawn from the record and labelled as the author's analysis.
      match: [analytical, analysis, inference]
    - id: forecast
      name: Forecast
      full: Forecast or risk
      note: A possible future outcome, stated as a risk and never as a prediction.
      match: [forecast, projection, risk]

  ui:
