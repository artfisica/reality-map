# The Civilian Geopolitical Reality Map / Mapa civil de la realidad geopolitica
#
# The markdown in content/ is canonical. This file records order, URLs, the
# links between documents, and the interface strings for each edition.

site:
  base_url: "https://artfisica.github.io/reality-map"
  default_lang: en
  author: Arturo Sánchez Pineda
  author_url: "https://www.linkedin.com/in/arturo-sanchez-pineda/"

  # Classification matching runs in this order, most specific first. It is
  # deliberately not the display order: "Historical synthesis supported by UN
  # record" must reach `finding` before `record` can claim the word "record".
  match_order: [forecast, inference, court, finding, position, record]

  # Terms the Spanish edition must not use. Checked by scripts/validate.py.
  # Only the nouns are prohibited, in favour of legalidad and falta de
  # legalidad. The adjectives lícito and ilícito stay available, because
  # phrases such as "uso ilícito de la fuerza" are legally precise.
  prohibited:
    es: [licitud, ilicitud]

  # The byline spelling the editions must use, checked in every content file.
  author_must_read: Arturo Sánchez Pineda

  # Source cells naming several documents rather than one. These are deliberate
  # aggregates, not missing URLs, so validation reports them as notes.
  aggregate_patterns:
    en:
      - "^Above sources"
      - "^Inquiry, oversight"
      - "records$"
      - "reports$"
      - "report$"
      - "above$"
    es:
      - "^Fuentes anteriores"
      - "^Investigaciones,"
      - "^Expedientes"
      - "anteriores$"
      - "anterior$"
      - "reportaje de la BBC$"

