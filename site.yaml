  evidence_paths:
    eyebrow: Siga la evidencia
    title: Observe cómo cambia la conclusión
    lede: >-
      Comience con una pregunta y recorra el expediente en el orden en que
      apareció la evidencia. Cada paso procede directamente de una afirmación
      clasificada; el paso final solo es tan fuerte como su etiqueta.
    step: "Paso {current} de {total}"
    previous: Paso anterior
    next: Paso siguiente
    ledger: Abrir la afirmación en el registro
    source: Fuente del expediente
    permitted: Lo que la evidencia permite
    paths:
      - id: transfers
        title: ¿Canelón fue extraditado o trasladado por otra vía?
        summary: >-
          Parta del expediente judicial estadounidense y observe cómo Pulido
          convierte un misterio marítimo aislado en un posible canal repetido.
        steps:
          - claim: VEN-CANELON-US-CUSTODY
            date: 2 de octubre de 2026
            turn: Un venezolano llega a un tribunal estadounidense. La acusación no es condena.
          - claim: VEN-CANELON-MARITIME-UNKNOWN
            date: Octubre de 2026
            turn: El FBI aporta un lugar marítimo, pero no los hechos jurisdiccionales.
          - claim: VEN-CANELON-NONEXTRADITION
            date: Derecho aplicable
            turn: El artículo 69 convierte custodia y entrega venezolanas en los hechos decisivos ausentes.
          - claim: VEN-PULIDO-US-CUSTODY
            date: 13 de octubre de 2026
            turn: Un segundo acusado aparece en Florida tras coordinación internacional no identificada.
          - claim: VEN-PULIDO-TRANSFER-ATTRIBUTED
            date: 13 de octubre de 2026
            turn: Los reportes sitúan a Pulido preso en Venezuela hasta su traslado.
          - claim: VEN-TRANSFER-CHANNEL-INFERENCE
            date: Evaluación actual
            turn: La repetición fortalece la hipótesis del canal sin probar una ruta compartida.
      - id: oil-control
        title: ¿Quién controla el petróleo venezolano?
        summary: >-
          Siga el expediente desde un anuncio general hasta afirmaciones
          oficiales publicadas, ejecución, impugnación institucional y las
          cláusulas que siguen ocultas.
        steps:
          - claim: VEN-OIL-DEAL-ANNOUNCEMENT-20260828
            date: 28 de agosto de 2026
            turn: Dos gobiernos anuncian escala y beneficios proyectados, no las cláusulas operativas.
          - claim: VEN-OIL-NABEP-OFFICIAL-TERMS
            date: 31 de agosto de 2026
            turn: Washington identifica la empresa y afirma derechos accionariales, de compra y gobernanza.
          - claim: VEN-OIL-GAZETTE-SUPPORT
            date: 1 de septiembre de 2026
            turn: El Parlamento publica su respaldo político, pero no el acuerdo que respalda.
          - claim: VEN-OIL-25-100-UNRESOLVED
            date: 7 de septiembre de 2026
            turn: Las versiones de 25 y 100 años no pueden leerse como un mismo derecho adquirido.
          - claim: VEN-OIL-GL52C
            date: 14 de septiembre de 2026
            turn: La ejecución avanza mediante sanciones sin revelar el contrato.
          - claim: VEN-OIL-SENATE-AUTHORITY-CHALLENGE
            date: 30 de septiembre de 2026
            turn: Senadores de alto rango cuestionan formalmente la autoridad legal; ningún tribunal ha fallado.
          - claim: VEN-OIL-OVERSIGHT-GAP
            date: 2 de octubre de 2026
            turn: El Congreso recibe un documento, pero la población todavía no puede examinarlo.
          - claim: VEN-OIL-DEAL-DISCLOSURE-GAP
            date: 14 de octubre de 2026
            turn: Los instrumentos determinantes siguen marcando el límite de lo que puede afirmarse honestamente.
      - id: custody-control
        title: ¿Cuándo se convierte la custodia en control?
        summary: >-
          Compare la arquitectura jurídica cambiante de Irak con el régimen
          venezolano explícito de desembolso y compruebe si la custodia externa
          produjo influencia política observable sin transferir propiedad.
        steps:
          - claim: IRQ-OIL-NYFED-CUSTODY
            date: 2003–2026
            turn: Los ingresos petroleros siguen siendo propiedad iraquí mientras Nueva York se vuelve el punto duradero de acceso.
          - claim: IRQ-DFI-SUCCESSOR-TRANSITION
            date: 2011–2014
            turn: Terminan el mandato de la ONU y la inmunidad estadounidense, pero las cuentas sucesoras preservan el lugar de custodia.
          - claim: VEN-EO14373-FUNDS
            date: 9 de enero de 2026
            turn: El régimen venezolano publicado va más lejos al asignar instrucciones de desembolso al secretario de Estado estadounidense.
          - claim: IRQ-CASH-LEVERAGE-2026
            date: Abril–julio de 2026
            turn: Una suspensión y reanudación condicionada convierten la dependencia estructural en influencia demostrada.
          - claim: VEN-GOLD-PROPOSED-TRANSFER
            date: 18 de septiembre de 2026
            turn: El traslado reportado del oro podría ampliar el patrón, pero no se documenta una transferencia completada.
          - claim: IRQ-VEN-ACCOUNT-COMPARISON
            date: Evaluación actual
            turn: El mecanismo común es custodia y acceso, no derecho idéntico ni propiedad estadounidense.

